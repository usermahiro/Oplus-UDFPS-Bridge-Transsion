name: Build ROM Integration Package

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      publish_mode:
        description: 'Publish destination'
        required: true
        default: 'artifact'
        type: choice
        options:
          - artifact
          - release
          - both

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build ROM overlay package
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          PROFILE: ${{ inputs.profile || 'release' }}
        run: |
          chmod +x build.sh build_release.sh
          ./build_release.sh "$PROFILE"

      - name: Prepare release metadata
        id: meta
        run: |
          VERSION="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          PROFILE="${{ inputs.profile || 'release' }}"
          ZIP_FILE="out/oplus-udfps-bridge-transsion-v${VERSION}-${PROFILE}.zip"
          SHA_FILE="${ZIP_FILE}.sha256"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}-build.${{ github.run_number }}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "sha_file=$SHA_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Actions Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_mode == 'artifact' || inputs.publish_mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: oplus-udfps-transsion-v${{ steps.meta.outputs.version }}-${{ inputs.profile || 'release' }}
          path: |
            ${{ steps.meta.outputs.zip_file }}
            ${{ steps.meta.outputs.sha_file }}
            out/transsion-vendor-fod-package.tar.gz
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_mode == 'release' || inputs.publish_mode == 'both')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Oplus UDFPS Bridge Transsion ${{ steps.meta.outputs.tag }}"
          files: |
            ${{ steps.meta.outputs.zip_file }}
            ${{ steps.meta.outputs.sha_file }}
            out/transsion-vendor-fod-package.tar.gz
          draft: false
          prerelease: ${{ (inputs.profile || 'release') == 'debug' }}
          generate_release_notes: true
          body: |
            ### Oplus UDFPS Bridge for Transsion Devices (ColorOS 14/15)
            
            - **Target Architecture**: aarch64-linux-android (API 31+)
            - **Profile**: `${{ inputs.profile || 'release' }}`
            - **Commit**: `${{ github.sha }}`
            
            #### Integration into ROM:
            Extract the ZIP directly into your ROM unpack directory or `/vendor`:
            ```bash
            unzip -o oplus-udfps-bridge-transsion-*.zip -d /path/to/rom/root/
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
